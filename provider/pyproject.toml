[project]
name = "provider"
version = "0.0.1"
description = "IDEN Core Server"
readme = "README.md"
authors = [
    { name = "yephonekyaw", email = "yephonekyaw231202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[project.scripts]
provider = "provider.core.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `scripts.seed` imports under pytest the same way it does under
# `uv run python -m scripts.seed`.
pythonpath = ["."]
asyncio_mode = "auto"
# Both are session-scoped so the session-scoped database engine and the tests
# that use it share one event loop; asyncpg connections cannot cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
