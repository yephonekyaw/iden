[project]
name = "provider"
version = "0.0.1"
description = "IDEN Core Server"
readme = "README.md"
authors = [
    { name = "yephonekyaw", email = "yephonekyaw231202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
]

[project.scripts]
provider = "provider:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
