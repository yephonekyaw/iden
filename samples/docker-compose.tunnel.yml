# Puts the four samples behind the same Cloudflare tunnel as the deployment,
# each on its own hostname.
#
#   docker compose -f samples/docker-compose.yml \
#                  -f samples/docker-compose.tunnel.yml up -d
#
# It changes one thing: the samples join the deployment's network, so cloudflared
# reaches them by service name.
#
# ---------------------------------------------------------------------------
# Why not host.docker.internal
# ---------------------------------------------------------------------------
# Because the base file publishes to 127.0.0.1 deliberately, and a port bound
# there is on the host's loopback and nowhere else. On Linux `host-gateway` is
# the bridge gateway address — 172.x.0.1, not loopback — so the connection is
# refused, while `curl localhost:5300` on that same host succeeds, because that
# *is* loopback. The two facts look contradictory and are not.
#
# It is also why pointing the tunnel at a container you published with
# `-p 7777:80` appears to work: no host_ip means all interfaces, gateway
# included. Publishing every sample that way would fix the symptom by putting
# them on every interface the server has — which, on a machine with a public
# address, is the internet, bypassing the tunnel you set up to avoid exactly
# that.
#
# Reaching containers by name skips the host entirely and behaves identically on
# Linux and Docker Desktop. The published loopback ports stay, harmlessly, so
# `curl localhost:5300` still works on the server itself.
#
# ---------------------------------------------------------------------------
# In the Cloudflare dashboard
# ---------------------------------------------------------------------------
# One public hostname per sample, each pointed at a service name and its port:
#
#   playground.example.org -> http://playground:5100
#   portal.example.org     -> http://portal:5200
#   library.example.org    -> http://library:5201
#   nextjs.example.org     -> http://nextjs:5300
#
# Then set the four *_ORIGIN values in samples/.env to those hostnames, and
# register each client's redirect URI against them — that is where the browser
# comes back to, and a redirect URI is matched exactly. The playground also
# needs its hostname in the provider's IDEN_ALLOWED_ADMIN_ORIGINS, because it is
# the one sample that calls the provider from the browser.
#
# One thing gets *easier* here. single-sign-out's back-channel logout URI is the
# provider reaching the sample, and on this network that is simply
# http://portal:5200/backchannel-logout — no host.docker.internal, no published
# port, and the same value on every machine.

services:
  playground:
    networks: [default, iden]
  portal:
    networks: [default, iden]
  library:
    networks: [default, iden]
  nextjs:
    networks: [default, iden]

networks:
  # The deployment's network, created by deploy/docker-compose.yml. `name:` is
  # the real Docker name, which is the compose project prefixed to `default` —
  # change IDEN_NETWORK if you renamed the project.
  iden:
    name: ${IDEN_NETWORK:-iden-dev_default}
    external: true
