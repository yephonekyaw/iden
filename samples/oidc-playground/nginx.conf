# The playground has no backend, so this only has to hand out one document.
#
# 5100 matches `pnpm dev`, and that is not cosmetic: the redirect URI you
# registered on the client names the port, and a redirect URI is matched
# exactly. Same port means the same client works against dev and the container.
server {
  listen 5100;
  root /usr/share/nginx/html;

  # Hashed filenames, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # /callback is a route in the browser, not a file: the app switches on
  # window.location.pathname. Without this fallback the return trip from IDEN —
  # the one moment the whole sample exists to show — would 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
