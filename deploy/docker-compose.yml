# The IDEN provider, the two stores it needs, and the two browser frontends.
#
# `docker compose -f deploy/docker-compose.yml up --build` brings up a working
# deployment: migrations run to completion, then the provider starts.
#
# Not here: TLS and a reverse proxy. Certificates are site-specific and the
# proxy is where flood protection belongs, so both are the operator's — see
# docs/operations/deployment.md and the reference config in
# nginx/iden.conf.example.
#
# `minio` and `engine` only start with `--profile biometric` — `docker compose
# up` alone never touches them, matching the module's "no cost when disabled"
# rule. Bring them up with:
#   IDEN_BIOMETRIC_ENABLED=true docker compose -f deploy/docker-compose.yml --profile biometric up --build
# The engine here is CPU-only (see `engine/README.md` for GPU passthrough,
# which needs an nvidia-container-toolkit host setup this file doesn't assume).

name: iden-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: iden
      POSTGRES_PASSWORD: iden
      POSTGRES_DB: iden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iden -d iden"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs to completion and exits. A separate service rather than an entrypoint
  # step so that scaling the provider to two replicas does not run the
  # migrations twice, concurrently, against the same database.
  migrate:
    build:
      context: ../provider
    command: ["alembic", "upgrade", "head"]
    environment: &provider-env
      IDEN_ENV: dev
      IDEN_DATABASE_URL: postgresql+asyncpg://iden:iden@postgres:5432/iden
      IDEN_REDIS_URL: redis://redis:6379/0
      IDEN_ISSUER: http://localhost:8000
      IDEN_AUTH_UI_BASE_URL: http://localhost:4000
      IDEN_ALLOWED_ADMIN_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      IDEN_SIGNING_KEY_DIR: /keys
      # Harmless when unset/false: the provider never imports `biometric.*`
      # or opens a MinIO connection unless this is true. Matches the
      # `minio`/`engine` services' own `biometric` profile below.
      IDEN_BIOMETRIC_ENABLED: ${IDEN_BIOMETRIC_ENABLED:-false}
      IDEN_ENGINE_BASE_URL: http://engine:8000
      IDEN_MINIO_ENDPOINT_URL: http://minio:9000
      IDEN_MINIO_ACCESS_KEY: iden
      IDEN_MINIO_SECRET_KEY: iden12345
      IDEN_MINIO_BUCKET: biometric-enrollments
    volumes: &provider-volumes
      # Generated on the host with `uv run python -m scripts.gen_keys`, and
      # read-only inside: the provider signs with these and never writes them.
      - ../provider/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  provider:
    build:
      context: ../provider
    environment: *provider-env
    volumes: *provider-volumes
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The two browser applications. Both are static builds: the issuer and the
  # organization's branding are written into /config.js at container start, so
  # the same image serves any deployment. Set IDEN_ORG_NAME to the organization
  # people think they are signing in to; it takes the larger type and IDEN drops
  # to a caption beneath it. IDEN_ORG_LOGO_URL is optional and sits beside it.
  auth-ui:
    build:
      context: ../web
      dockerfile: auth-ui/Dockerfile
    environment:
      IDEN_ISSUER: http://localhost:8000
      IDEN_ORG_NAME: ""
      IDEN_ORG_LOGO_URL: ""
    ports:
      - "4000:4000"
    depends_on:
      provider:
        condition: service_started

  dashboard:
    build:
      context: ../web
      dockerfile: dashboard/Dockerfile
    environment:
      IDEN_ISSUER: http://localhost:8000
      IDEN_ORG_NAME: ""
      IDEN_ORG_LOGO_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      provider:
        condition: service_started

  # Object storage for enrollment images. Same access key/secret as
  # `provider-env` above — this is dev-only, not a production credential.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iden
      MINIO_ROOT_PASSWORD: iden12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["biometric"]

  # Face detection, embedding, and liveness — see `engine/README.md`. Never
  # called by the kiosk directly; only the provider's Biometric RS reaches it.
  # CPU-only here — see the file header for GPU passthrough.
  engine:
    build:
      context: ../engine
    environment:
      ENGINE_ENV: dev
    ports:
      - "8001:8000"
    profiles: ["biometric"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
