name: Documentation

# Pull requests build but do not publish, so a broken link is caught before it
# is merged rather than after it is live.
#
# The path lists are duplicated because GitHub Actions does not support YAML
# anchors — keep the two in step.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - provider/pyproject.toml
      - provider/uv.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - provider/pyproject.toml
      - provider/uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A queued run is cancelled rather than racing the one
# in front of it — the newest commit is the one worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --strict turns a broken internal link into a failed build. That is the
      # point of running this in CI at all.
      - name: Build
        run: uv run --project provider mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
